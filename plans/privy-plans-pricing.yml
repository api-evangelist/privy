specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Privy
providerId: privy
created: '2026-05-08'
modified: '2026-05-08'
reconciled: true
tags:
- Web3
- Wallets
- Authentication
- Embedded Wallets
- MPC
- Plans
description: Privy is sold by monthly active wallets (MAW) with included wallet operations
  and overage rates. Pricing scales with MAW.
notes: Verify against privy.io/pricing.
sources:
- https://www.privy.io/pricing
plans:
- id: privy-free
  name: Free
  type: free
  description: Free up to a small monthly active wallet count for prototyping.
  entries:
  - label: Monthly Active Wallets
    name: maw
    type: included
    metric: wallets
    limit: 1000
    timeFrame: month
    geo: global
    unit: 1
    price: 0
    userMultiplied: false
  elements:
  - name: Embedded Wallets
  - name: Authentication
  - name: Community Support
- id: privy-pro
  name: Pro
  type: paid
  description: Production tier with higher MAW allotment and overage pricing.
  entries:
  - label: Monthly Subscription
    name: monthly_subscription
    type: flat
    metric: subscription
    limit: 1
    timeFrame: month
    geo: global
    unit: 1
    price: 99
    userMultiplied: false
  - label: Included MAW
    name: included_maw
    type: included
    metric: wallets
    limit: 25000
    timeFrame: month
    geo: global
    unit: 1
    price: 0
    userMultiplied: false
  - label: MAW Overage
    name: maw_overage
    type: overage
    metric: wallet
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: see pricing page
    userMultiplied: false
  elements:
  - name: Server Wallets
  - name: Webhooks
  - name: Email Support
- id: privy-enterprise
  name: Enterprise
  type: enterprise
  description: Custom enterprise contracts with SOC 2 Type II and dedicated support.
  entries:
  - label: Custom
    name: custom
    type: flat
    metric: contract
    limit: -1
    timeFrame: year
    geo: global
    unit: 1
    price: contact sales
    userMultiplied: false
  elements:
  - name: SOC 2 Type II
  - name: Dedicated Support
  - name: Custom Auth Methods
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
