specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Privy
providerId: privy
created: '2026-05-08'
modified: '2026-05-08'
reconciled: true
tags:
- Web3
- Wallets
- Authentication
- Embedded Wallets
- MPC
- Rate Limiting
description: Privy enforces per-app rate limits on REST API endpoints. Default tiers
  vary per endpoint family.
notes: Wallet RPC endpoints are throttled separately from user/auth endpoints.
sources:
- https://docs.privy.io/api-reference/introduction
responseCodes:
  throttled: 429
limits:
- name: Default
  scope: app
  metric: requests_per_second
  limit: 10
  notes: Default per-app limit; varies per endpoint.
policies:
- name: Backoff Strategy
  description: Exponential backoff on 429.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
